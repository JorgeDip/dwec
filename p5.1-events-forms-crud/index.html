<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Store</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main>
        <section>
            <form id="petForm">
                <div class="form-group">
                    <label for="name">Name of the pet</label>
                    <input type="text" id="name" placeholder="Name of the pet">
                    <div class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="description">Description of the pet</label>
                    <input type="text" id="description" placeholder="Description of the pet">
                    <div class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="image">Image URL</label>
                    <input type="text" id="image" placeholder="Image URL">
                    <div class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="birthdate">Birthdate</label>
                    <input type="date" id="birthdate">
                    <div class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="price">Price</label>
                    <input type="number" id="price" placeholder="Price">
                    <div class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="pet_code">Pet code</label>
                    <input type="text" id="pet_code" placeholder="Pet code">
                    <div class="error-message"></div>
                </div>
                <div class="form-group">
                    <input type="checkbox" id="is_sold"> <label for="is_sold">Is sold?</label>
                </div>
                <div class="form-group">
                    <button type="submit">Add pet</button>
                </div>
            </form>
        </section>

                <template id="template-pet-card">
                    <article class="pet-card">
                        <div class="pet-image-container">
                            <img class="pet-image" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1"
